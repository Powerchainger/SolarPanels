services:
  mongo:
    image: docker.io/library/mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build: .
    depends_on:
      mongo:
        condition: service_healthy
    env_file: .env
    environment:
      - MONGO_URI=mongodb://mongo:27017
      - WORKER_ID=${WORKER_ID:-worker-1}
    restart: unless-stopped

volumes:
  mongo-data:
