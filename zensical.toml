# Documentation site, built with Zensical (https://zensical.org):
#   uv run --group docs zensical serve            # preview on localhost:8000
#   uv run --group docs zensical build --strict   # fails on broken links
[project]
site_name = "Solar Scraper"
site_description = "Collects solar inverter data from EnPhase and Growatt and forwards it to an output API."
docs_dir = "docs"

nav = [
  { "Overview" = "index.md" },
  { "Operations" = [
    { "Concepts" = "operations/concepts.md" },
    { "Installation" = "operations/installation.md" },
    { "Configuration" = "operations/configuration.md" },
    { "Managing accounts" = "operations/accounts.md" },
    { "Monitoring" = "operations/monitoring.md" },
    { "Maintenance" = "operations/maintenance.md" },
    { "Troubleshooting" = "operations/troubleshooting.md" },
  ] },
  { "Technical reference" = [
    { "Architecture" = "technical/architecture.md" },
    { "Adding a provider" = "technical/adding-a-provider.md" },
  ] },
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.sections",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
